name: Validate Milan Store

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check server syntax
        run: npm run check

      - name: Run backend integration tests
        run: npm run test:server

      - name: Build production bundle
        run: npm run build

      - name: Build Coolify container
        run: docker build --tag milan-auto:ci .
